services:
  python-ai:
    build: ./python-ai
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8000:8000"

  backend:
    build: ./Backend
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - PythonService__BaseUrl=http://python-ai:8000
    ports:
      - "8080:8080"
    depends_on:
      - python-ai
